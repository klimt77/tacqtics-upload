<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TACQOCR v4</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#0F1A1F; --surface:#162028; --surface2:#1C2A34; --border:#243340;
  --teal:#0F3342; --green:#62E87C; --green-dim:#3a8a4a;
  --white:#F0F4F5; --muted:#7A9BAA; --danger:#E86262;
  --radius:16px; --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
html,body { height:100%; font-family:var(--font); background:var(--bg); color:var(--white); }
.app { width:100%; max-width:430px; min-height:100vh; margin:0 auto; display:flex; flex-direction:column; }
.header { display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); gap:12px; }
.logo-icon { width:36px; height:36px; background:var(--teal); border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--green); flex-shrink:0; }
.logo-name { font-size:15px; font-weight:700; letter-spacing:0.1em; }
.logo-sub  { font-size:9px; letter-spacing:0.18em; color:var(--green); }
.version { font-size:9px; color:var(--muted); margin-left:auto; }
.key-banner { margin:16px 20px 0; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:10px; }
.key-banner h3 { font-size:13px; font-weight:600; }
.key-banner p { font-size:12px; color:var(--muted); line-height:1.5; }
.key-row { display:flex; gap:8px; }
.key-input { flex:1; background:var(--bg); border:1.5px solid var(--border); border-radius:10px; padding:11px 14px; color:var(--white); font-size:13px; outline:none; }
.btn-save { background:var(--green); border:none; border-radius:10px; padding:11px 16px; color:#071a0e; font-weight:700; font-size:13px; cursor:pointer; }
.key-set { margin:12px 20px 0; background:var(--surface); border:1px solid var(--green-dim); border-radius:var(--radius); padding:10px 14px; display:flex; align-items:center; justify-content:space-between; }
.key-set-label { font-size:13px; color:var(--green); }
.btn-change { background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; }
.main { flex:1; display:flex; flex-direction:column; padding:24px 20px; gap:20px; }
.section-label { font-size:11px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
.action-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.action-btn { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:24px 14px 20px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--white); text-align:center; transition:border-color .15s; }
.action-btn:hover { border-color:var(--green); background:#182d38; }
.action-icon { width:48px; height:48px; background:var(--teal); border-radius:13px; display:flex; align-items:center; justify-content:center; color:var(--green); }
.action-title { font-size:14px; font-weight:700; }
.action-sub   { font-size:11px; color:var(--muted); }
.preview-wrap { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
.preview-bar  { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border); }
.preview-bar-name { flex:1; min-width:0; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.clear-btn { background:none; border:none; cursor:pointer; color:var(--muted); padding:4px; display:flex; }
.preview-img { width:100%; max-height:260px; object-fit:contain; background:#0a1318; display:block; }
.preview-pdf { padding:24px; display:flex; flex-direction:column; align-items:center; gap:8px; }
.preview-pdf-name { font-size:14px; font-weight:600; }
.preview-pdf-size { font-size:12px; color:var(--muted); }
.status-box { border-radius:var(--radius); padding:14px 16px; font-size:13px; display:flex; align-items:center; gap:10px; }
.status-box.loading { background:#1a2e38; color:var(--muted); }
.status-box.error   { background:#2a0f0f; color:var(--danger); border:1px solid #5a2020; }
.spinner { width:16px; height:16px; flex-shrink:0; border:2px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.analyse-btn { background:var(--green); color:#071a0e; border:none; border-radius:var(--radius); padding:18px; font-size:15px; font-weight:700; cursor:pointer; width:100%; }
.analyse-btn:disabled { background:var(--border); color:var(--muted); cursor:not-allowed; }
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:300; display:flex; align-items:flex-end; justify-content:center; }
.overlay.hidden { display:none; }
.sheet { background:var(--surface2); border-radius:22px 22px 0 0; width:100%; max-width:430px; max-height:92vh; display:flex; flex-direction:column; animation:slideUp .25s ease; }
@keyframes slideUp { from{transform:translateY(60px);opacity:0} to{transform:none;opacity:1} }
.sheet-handle { width:36px; height:4px; background:var(--border); border-radius:2px; margin:14px auto 0; flex-shrink:0; }
.sheet-header { padding:16px 20px 0; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.sheet-title { font-size:18px; font-weight:700; }
.sheet-close { background:none; border:none; cursor:pointer; color:var(--muted); padding:4px; display:flex; }
.sheet-scroll { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px; }
.sheet-footer { padding:16px 20px 32px; flex-shrink:0; }
.ocr-field { background:var(--surface); border-radius:12px; padding:14px 16px; }
.ocr-field-label { font-size:10px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.ocr-field-value { font-size:15px; font-weight:600; color:var(--white); line-height:1.4; }
.ocr-field-value.empty { color:var(--muted); font-weight:400; font-size:13px; font-style:italic; }
.ocr-field.highlight { border:1.5px solid var(--green-dim); }
.ocr-field.highlight .ocr-field-value { color:var(--green); font-size:20px; }
.ocr-divider { font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); padding:4px 0; border-bottom:1px solid var(--border); }
.close-btn { background:none; border:1.5px solid var(--border); border-radius:var(--radius); padding:15px; color:var(--white); font-size:14px; font-weight:600; cursor:pointer; width:100%; }
.hidden { display:none !important; }
input[type="file"] { display:none; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo-icon">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="9" y1="13" x2="15" y2="13"/>
        <line x1="9" y1="17" x2="13" y2="17"/>
      </svg>
    </div>
    <div>
      <div class="logo-name">TACQOCR</div>
      <div class="logo-sub">Invoice Scanner</div>
    </div>
    <div class="version">v4 · gemini-1.5-flash</div>
  </header>

  <div class="key-banner" id="keyBanner">
    <h3>🔑 Gemini API Key</h3>
    <p>Free key from <strong>aistudio.google.com/app/apikey</strong> — saved only on this device.</p>
    <div class="key-row">
      <input class="key-input" id="keyInput" type="password" placeholder="AIza...">
      <button class="btn-save" onclick="saveKey()">Save</button>
    </div>
  </div>

  <div class="key-set hidden" id="keySet">
    <span class="key-set-label">✅ Gemini API key configured</span>
    <button class="btn-change" onclick="changeKey()">Change</button>
  </div>

  <main class="main">
    <div>
      <div class="section-label">Scan invoice</div>
      <div class="action-row">
        <button class="action-btn" onclick="openCamera()">
          <div class="action-icon">
            <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <div class="action-title">Camera</div>
          <div class="action-sub">Take a photo</div>
        </button>
        <button class="action-btn" onclick="openFile()">
          <div class="action-icon">
            <svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="12" y1="18" x2="12" y2="12"/>
              <line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
          </div>
          <div class="action-title">From device</div>
          <div class="action-sub">Photo or PDF</div>
        </button>
      </div>
    </div>

    <div class="preview-wrap hidden" id="previewWrap">
      <div class="preview-bar">
        <span class="preview-bar-name" id="previewName"></span>
        <button class="clear-btn" onclick="clearFile()">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="previewBody"></div>
    </div>

    <div class="status-box hidden" id="statusBox">
      <div class="spinner hidden" id="statusSpinner"></div>
      <span id="statusMsg"></span>
    </div>

    <button class="analyse-btn" id="analyseBtn" onclick="analyse()" disabled>
      🔍 Analyse invoice
    </button>
  </main>
</div>

<div class="overlay hidden" id="resultOverlay" onclick="if(event.target===this)closeResult()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">Invoice data</div>
      <button class="sheet-close" onclick="closeResult()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="sheet-scroll" id="resultContent"></div>
    <div class="sheet-footer">
      <button class="close-btn" onclick="closeResult()">Close</button>
    </div>
  </div>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment">
<input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/heic,application/pdf">

<script>
'use strict';

// ── IMPORTANT: Model version clearly shown ──
const MODEL    = 'gemini-1.5-flash';
const BASE_URL = 'https://generativelanguage.googleapis.com/v1/models/' + MODEL + ':generateContent?key=';
const KEY_STORAGE = 'tq_gemini_key_v4';

console.log('TACQOCR v3 loaded, model:', MODEL);

// Clear any old service workers
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(r) {
    r.forEach(function(sw) { sw.unregister(); });
  });
}

let file = null;

// ── Key management ──
function getKey() { return localStorage.getItem(KEY_STORAGE) || ''; }

function saveKey() {
  var k = document.getElementById('keyInput').value.trim();
  if (!k) { alert('Please enter a key'); return; }
  localStorage.setItem(KEY_STORAGE, k);
  document.getElementById('keyInput').value = '';
  showKeySet();
}

function changeKey() {
  localStorage.removeItem(KEY_STORAGE);
  document.getElementById('keyBanner').classList.remove('hidden');
  document.getElementById('keySet').classList.add('hidden');
}

function showKeySet() {
  document.getElementById('keyBanner').classList.add('hidden');
  document.getElementById('keySet').classList.remove('hidden');
}

// Init
(function() {
  if (getKey()) showKeySet();
})();

// ── File handling ──
document.getElementById('cameraInput').addEventListener('change', function(e) { onFile(e.target.files[0]); });
document.getElementById('fileInput').addEventListener('change',   function(e) { onFile(e.target.files[0]); });
function openCamera() { document.getElementById('cameraInput').click(); }
function openFile()   { document.getElementById('fileInput').click(); }

function onFile(f) {
  if (!f) return;
  file = f;
  document.getElementById('previewName').textContent = f.name;
  var body = document.getElementById('previewBody');
  if (f.type.startsWith('image/')) {
    body.innerHTML = '<img style="width:100%;max-height:260px;object-fit:contain;background:#0a1318;display:block" src="' + URL.createObjectURL(f) + '">';
  } else {
    body.innerHTML = '<div class="preview-pdf"><div class="preview-pdf-name">' + esc(f.name) + '</div><div class="preview-pdf-size">' + (f.size/1024).toFixed(0) + ' KB · PDF</div></div>';
  }
  document.getElementById('previewWrap').classList.remove('hidden');
  document.getElementById('analyseBtn').disabled = false;
  clearStatus();
}

function clearFile() {
  file = null;
  document.getElementById('previewWrap').classList.add('hidden');
  document.getElementById('cameraInput').value = '';
  document.getElementById('fileInput').value   = '';
  document.getElementById('analyseBtn').disabled = true;
  clearStatus();
}

// ── Status ──
function showStatus(type, msg) {
  var b = document.getElementById('statusBox');
  b.className = 'status-box ' + type;
  b.classList.remove('hidden');
  var sp = document.getElementById('statusSpinner');
  if (type === 'loading') sp.classList.remove('hidden'); else sp.classList.add('hidden');
  document.getElementById('statusMsg').textContent = msg;
}
function clearStatus() { document.getElementById('statusBox').classList.add('hidden'); }

// ── Result ──
function closeResult() { document.getElementById('resultOverlay').classList.add('hidden'); }

function showResult(data) {
  var html = '';
  if (data.total_ttc && data.total_ttc !== 'N/A') html += field('Total TTC', data.total_ttc, true);
  html += '<div class="ocr-divider">Invoice details</div>';
  html += field('Invoice number', data.invoice_number);
  html += field('Date', data.date);
  html += field('Due date', data.due_date);
  html += '<div class="ocr-divider">Supplier</div>';
  html += field('Name', data.supplier_name);
  html += field('Address', data.supplier_address);
  html += field('VAT number', data.supplier_vat);
  html += '<div class="ocr-divider">Client</div>';
  html += field('Name', data.client_name);
  html += field('Address', data.client_address);
  html += '<div class="ocr-divider">Amounts</div>';
  html += field('Total HT', data.total_ht);
  html += field('VAT amount', data.vat_amount);
  html += field('VAT rate', data.vat_rate);
  html += field('Currency', data.currency);
  if (data.description && data.description !== 'N/A') {
    html += '<div class="ocr-divider">Description</div>';
    html += field('Services / items', data.description);
  }
  document.getElementById('resultContent').innerHTML = html;
  document.getElementById('resultOverlay').classList.remove('hidden');
}

function field(label, value, highlight) {
  var empty = !value || value === 'N/A' || value === '' || value === 'null';
  return '<div class="ocr-field' + (highlight ? ' highlight' : '') + '">' +
    '<div class="ocr-field-label">' + esc(label) + '</div>' +
    '<div class="ocr-field-value' + (empty ? ' empty' : '') + '">' + (empty ? 'Not found' : esc(value)) + '</div>' +
    '</div>';
}

// ── Analyse ──
async function analyse() {
  if (!file) return;
  var key = getKey();
  if (!key) { showStatus('error', 'Please enter your Gemini API key first.'); return; }

  document.getElementById('analyseBtn').disabled = true;
  showStatus('loading', 'Analysing with ' + MODEL + '…');

  try {
    var b64  = await toBase64(file);
    var mime = file.type || 'image/jpeg';

    var prompt = 'You are an invoice OCR expert. Extract all data and return ONLY valid JSON: {"is_invoice":true,"invoice_number":"","date":"","due_date":"","supplier_name":"","supplier_address":"","supplier_vat":"","client_name":"","client_address":"","total_ht":"","vat_rate":"","vat_amount":"","total_ttc":"","currency":"","description":""}. If not an invoice return {"is_invoice":false}. Use N/A for missing fields. JSON only, no markdown.';

    var url = BASE_URL + key;
    console.log('Calling:', url.replace(key, 'KEY_HIDDEN'));

    var res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [
          { inline_data: { mime_type: mime, data: b64 } },
          { text: prompt }
        ]}]
      })
    });

    if (!res.ok) {
      var err = await res.json();
      throw new Error(err.error ? err.error.message : 'HTTP ' + res.status);
    }

    var result = await res.json();
    var text = result.candidates[0].content.parts[0].text;
    var parsed = JSON.parse(text.replace(/```json|```/g, '').trim());

    clearStatus();

    if (!parsed.is_invoice) {
      showStatus('error', '⚠️ Not an invoice or receipt. Please try with a valid invoice.');
      document.getElementById('analyseBtn').disabled = false;
      return;
    }

    showResult(parsed);

  } catch(e) {
    showStatus('error', 'Error: ' + e.message);
  }

  document.getElementById('analyseBtn').disabled = false;
}

function toBase64(f) {
  return new Promise(function(res, rej) {
    var r = new FileReader();
    r.onload  = function() { res(r.result.split(',')[1]); };
    r.onerror = function() { rej(new Error('Read failed')); };
    r.readAsDataURL(f);
  });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
